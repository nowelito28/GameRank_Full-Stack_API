name: Deploy to Local Minikube with Helm Chart

on:
  push:
    branches: [ main ]
  fork:
  workflow_dispatch:

jobs:
  ci:
    # Build phase (Continuous Integration): prepare the environment, build the Docker image and load it into Minikube

    # Run only on the dedicated self-hosted runner labeled "gamerank-runner"
    # This label should exist on a single prepared machine, so CI and CD share the same local Docker/Minikube state
    runs-on: [self-hosted, gamerank-runner]

    # We use bash for all steps (macOS, Linux and Windows with Git Bash installed)
    # Requirement on Windows: have Git for Windows -> https://git-scm.com/download/win
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: false

      - name: Check and Install CI Tools (macOS / Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: |
          set -e

          # Detect the runner CPU architecture
          ARCH_RAW="$(uname -m)"
          case "$ARCH_RAW" in
            x86_64|amd64)
              ARCH="amd64"
              ;;
            arm64|aarch64)
              ARCH="arm64"
              ;;
            *)
              echo "Unsupported architecture: $ARCH_RAW"
              exit 1
              ;;
          esac
          echo "Detected architecture: $ARCH"

          # curl
          if command -v curl >/dev/null 2>&1; then
            echo "curl is installed:"
            curl --version | head -n 1
          elif [ "$RUNNER_OS" = "Linux" ]; then
            echo "curl not found, installing curl..."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y curl
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y curl
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y curl
            else
              echo "No supported package manager found to install curl."
              exit 1
            fi
          else
            echo "curl is not installed on this macOS runner."
            exit 1
          fi

          # Docker
          if command -v docker >/dev/null 2>&1; then
            echo "Docker is installed:"
            docker --version
          else
            echo "Docker is not installed on this $RUNNER_OS runner."
            echo "Install Docker manually on the runner before using this workflow."
            exit 1
          fi

          # Minikube
          if command -v minikube >/dev/null 2>&1; then
            echo "Minikube is already installed:"
            minikube version
          else
            echo "Minikube is not installed on this $RUNNER_OS runner."
            echo "Install Minikube manually on the runner before using this workflow."
            exit 1
          fi

      - name: Check and Install CI Tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Git Bash / Git for Windows
          if (-not (Get-Command bash -ErrorAction SilentlyContinue)) {
            Write-Host "Git Bash not found, installing Git for Windows..."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id Git.Git -e --silent
            } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install git -y
            } else {
              Write-Error "Neither winget nor choco was found. Install Git for Windows manually."
              exit 1
            }

            $gitBin = "C:\Program Files\Git\bin"
            $gitCmd = "C:\Program Files\Git\cmd"
            Add-Content -Path $env:GITHUB_PATH -Value $gitBin
            Add-Content -Path $env:GITHUB_PATH -Value $gitCmd
            Write-Host "Git for Windows installed and added to GITHUB_PATH."
          } else {
            Write-Host "Git Bash is already installed."
          }

          # Detect the runner CPU architecture
          $archRaw = $env:PROCESSOR_ARCHITECTURE
          switch ($archRaw) {
            "AMD64" { $arch = "amd64" }
            "ARM64" { $arch = "arm64" }
            default {
              Write-Error "Unsupported architecture: $archRaw"
              exit 1
            }
          }
          Write-Host "Detected architecture: $arch"

          # Docker
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            Write-Host "Docker is installed:"
            docker --version
          } else {
            Write-Error "Docker is not installed on this Windows runner. Install Docker Desktop manually."
            exit 1
          }

          # Minikube
          if (Get-Command minikube -ErrorAction SilentlyContinue) {
            Write-Host "Minikube is already installed:"
            minikube version
          } else {
            Write-Error "Minikube is not installed on this Windows runner. Install Minikube manually."
            exit 1
          }

      - name: Start Docker and Minikube
        run: |
          # Start Docker depending on the operating system
          if [ "$RUNNER_OS" = "macOS" ]; then
            open -a Docker || true

          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo systemctl start docker || true

          elif [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -Command '
              $dockerDesktopPaths = @(
                "C:\Program Files\Docker\Docker\Docker Desktop.exe",
                "C:\Program Files\Docker\Docker\Docker Desktop"
              )

              $started = $false
              foreach ($path in $dockerDesktopPaths) {
                if (Test-Path $path) {
                  Start-Process -FilePath $path
                  $started = $true
                  break
                }
              }

              if (-not $started) {
                Write-Host "Docker Desktop executable was not found in the standard paths."
              }
            '
          fi

          # Wait until Docker is ready, but fail if it never starts
          ready=0
          for i in $(seq 1 60); do
            if docker system info > /dev/null 2>&1; then
              echo "Docker is ready."
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Docker is installed but not running on this $RUNNER_OS runner."
            exit 1
          fi

          # Start Minikube if it is not already running
          minikube status || minikube start

      - name: Build Docker Image
        run: |
          # Build the application image from the repository Dockerfile
          # Note: this workflow still uses the mutable tag "latest", so it depends on the dedicated runner's local state
          docker build -t nowelito28/gamerank:latest .

      - name: Load Image into Minikube
        run: |
          # Load the locally built image into the Minikube image cache of the self-hosted runner
          minikube image load nowelito28/gamerank:latest

          # Show the images currently available inside Minikube
          minikube image ls

  cd:
    # Deployment phase (Continuous Deployment): prepare Helm/Kubernetes tooling, deploy the chart and validate the release

    # Run in any local server regardless of the OS that also has the label gamerank-runner:
    runs-on: [self-hosted, gamerank-runner]
    needs: ci

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          clean: false

      - name: Check and Install CD Tools (macOS / Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: |
          set -e

          # Detect the runner CPU architecture
          ARCH_RAW="$(uname -m)"
          case "$ARCH_RAW" in
            x86_64|amd64)
              ARCH="amd64"
              ;;
            arm64|aarch64)
              ARCH="arm64"
              ;;
            *)
              echo "Unsupported architecture: $ARCH_RAW"
              exit 1
              ;;
          esac
          echo "Detected architecture: $ARCH"

          # curl
          if command -v curl >/dev/null 2>&1; then
            echo "curl is installed:"
            curl --version | head -n 1
          elif [ "$RUNNER_OS" = "Linux" ]; then
            echo "curl not found, installing curl..."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y curl
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y curl
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y curl
            else
              echo "No supported package manager found to install curl."
              exit 1
            fi
          else
            echo "curl is not installed on this macOS runner."
            exit 1
          fi

          # kubectl
          if command -v kubectl >/dev/null 2>&1; then
            echo "kubectl is already installed:"
            kubectl version --client=true --output=yaml | head -n 20
          else
            echo "kubectl not found, installing kubectl..."

            if [ "$RUNNER_OS" = "macOS" ]; then
              KUBECTL_OS="darwin"
            else
              KUBECTL_OS="linux"
            fi

            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/${KUBECTL_OS}/${ARCH}/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
            kubectl version --client=true
          fi

          # Helm
          if command -v helm >/dev/null 2>&1; then
            echo "Helm is already installed:"
            helm version --short
          else
            echo "Helm not found, installing Helm..."
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm version --short
          fi

          # Minikube
          if command -v minikube >/dev/null 2>&1; then
            echo "Minikube is already installed:"
            minikube version
          else
            echo "Minikube is not installed on this $RUNNER_OS runner."
            echo "Install Minikube manually on the runner before using this workflow."
            exit 1
          fi

      - name: Check and Install CD Tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GSUDO_CREDENTIALS_PASSWORD: ${{ secrets.W_PASS }}
        run: |
          # Git Bash / Git for Windows
          if (-not (Get-Command bash -ErrorAction SilentlyContinue)) {
            Write-Host "Git Bash not found, installing Git for Windows..."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id Git.Git -e --silent
            } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install git -y
            } else {
              Write-Error "Neither winget nor choco was found. Install Git for Windows manually."
              exit 1
            }

            $gitBin = "C:\Program Files\Git\bin"
            $gitCmd = "C:\Program Files\Git\cmd"
            Add-Content -Path $env:GITHUB_PATH -Value $gitBin
            Add-Content -Path $env:GITHUB_PATH -Value $gitCmd
            Write-Host "Git for Windows installed and added to GITHUB_PATH."
          } else {
            Write-Host "Git Bash is already installed."
          }

          # Detect the runner CPU architecture
          $archRaw = $env:PROCESSOR_ARCHITECTURE
          switch ($archRaw) {
            "AMD64" { $arch = "amd64" }
            "ARM64" { $arch = "arm64" }
            default {
              Write-Error "Unsupported architecture: $archRaw"
              exit 1
            }
          }
          Write-Host "Detected architecture: $arch"

          # curl
          if (Get-Command curl.exe -ErrorAction SilentlyContinue) {
            Write-Host "curl is installed."
          } else {
            Write-Error "curl is not available on this Windows runner."
            exit 1
          }

          # kubectl
          if (Get-Command kubectl -ErrorAction SilentlyContinue) {
            Write-Host "kubectl is already installed:"
            kubectl version --client=true
          } else {
            Write-Host "kubectl not found, installing kubectl..."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id Kubernetes.kubectl -e --silent
            } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install kubernetes-cli -y
            } else {
              Write-Error "Neither winget nor choco was found. Install kubectl manually."
              exit 1
            }
            kubectl version --client=true
          }

          # Helm
          if (Get-Command helm -ErrorAction SilentlyContinue) {
            Write-Host "Helm is already installed:"
            helm version --short
          } else {
            Write-Host "Helm not found, installing Helm..."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id Helm.Helm -e --silent
            } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install kubernetes-helm -y
            } else {
              Write-Error "Neither winget nor choco was found. Install Helm manually."
              exit 1
            }
            helm version --short
          }

          # Minikube
          if (Get-Command minikube -ErrorAction SilentlyContinue) {
            Write-Host "Minikube is already installed:"
            minikube version
          } else {
            Write-Error "Minikube is not installed on this Windows runner. Install Minikube manually."
            exit 1
          }

          # gsudo
          if (Get-Command gsudo -ErrorAction SilentlyContinue) {
            Write-Host "gsudo is already installed."
          } else {
            Write-Host "gsudo not found, installing gsudo..."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id gerardog.gsudo -e --silent
            } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install gsudo -y
            } else {
              Write-Error "Neither winget nor choco was found. Install gsudo manually."
              exit 1
            }
            Write-Host "gsudo installed successfully."
          }

      - name: Start Docker and Minikube
        run: |
          # Start Docker and Minikube for the deployment job if they are not already running

          # Start Docker depending on the operating system
          if [ "$RUNNER_OS" = "macOS" ]; then
            open -a Docker || true

          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo systemctl start docker || true

          elif [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -Command '
              $dockerDesktopPaths = @(
                "C:\Program Files\Docker\Docker\Docker Desktop.exe",
                "C:\Program Files\Docker\Docker\Docker Desktop"
              )

              $started = $false
              foreach ($path in $dockerDesktopPaths) {
                if (Test-Path $path) {
                  Start-Process -FilePath $path
                  $started = $true
                  break
                }
              }

              if (-not $started) {
                Write-Host "Docker Desktop executable was not found in the standard paths."
              }
            '
          fi

          # Wait until Docker is ready, but fail if it never starts
          ready=0
          for i in $(seq 1 60); do
            if docker system info > /dev/null 2>&1; then
              echo "Docker is ready."
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Docker is installed but not running on this $RUNNER_OS runner."
            exit 1
          fi

          # Start Minikube if it is not already running
          minikube status || minikube start

      - name: Check Cluster Connectivity
        run: |
          kubectl cluster-info

      - name: Create and Select Namespace
        run: |
          # Create the target namespace if it does not already exist
          kubectl create namespace gamerank-ns --dry-run=client -o yaml | kubectl apply -f -

          # Set the current kubectl context to use the target namespace
          kubectl config set-context --current --namespace=gamerank-ns

      - name: Enable Minikube Ingress Addon
        run: |
          # Enable the Minikube NGINX Ingress controller
          minikube addons enable ingress || true

      - name: Lint Helm Chart
        run: |
          # Validate the Helm chart structure and templates
          helm lint ./chart_helm

      - name: Render Helm Templates
        run: |
          # Render the chart locally to verify the generated Kubernetes manifests
          helm template gamerank ./chart_helm -n gamerank-ns

      - name: Start Minikube Tunnel (macOS / Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: |
          # Stop any previous tunnel process if it is still running
          echo "${{ secrets.PASS }}" | sudo -S pkill -f "minikube tunnel" || true

          # Start the tunnel in the background and write its output to tunnel.log
          echo "${{ secrets.PASS }}" | sudo -S nohup minikube tunnel > tunnel.log 2>&1 &

      - name: Start Minikube Tunnel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GSUDO_CREDENTIALS_PASSWORD: ${{ secrets.W_PASS }}
        run: |
          # Stop any previous tunnel process if it is still running
          gsudo --no-auth-if-already-elevated taskkill /F /IM minikube.exe 2>$null || $true

          # Start the tunnel in the background
          $pass = $env:GSUDO_CREDENTIALS_PASSWORD
          Start-Job -ScriptBlock {
            $env:GSUDO_CREDENTIALS_PASSWORD = $using:pass
            gsudo minikube tunnel *> tunnel.log
          }

      - name: Deploy to Minikube with Helm
        run: |
          # Install or upgrade the Helm release in the target namespace
          helm upgrade --install gamerank ./chart_helm --namespace gamerank-ns --create-namespace -f ./chart_helm/values.yaml

      - name: Validate Deployment
        run: |
          # Wait until the Deployment rollout finishes successfully
          kubectl rollout status deployment/gamerank-deployment -n gamerank-ns --timeout=90s

          # Show cluster nodes
          kubectl get nodes -o wide

          # Show deployed Pods
          kubectl get pods -n gamerank-ns

          # Show Deployment resources
          kubectl get deployment -n gamerank-ns

          # Show Service resources
          kubectl get svc -n gamerank-ns

          # Show Ingress resources
          kubectl get ingress -n gamerank-ns

          # Show Helm releases in the namespace
          helm list -n gamerank-ns

      - name: Show App URL
        run: |
          # Print the application URL exposed by the Ingress
          echo "URL to the deployed app (main page): http://$(kubectl get ingress gamerank-ingress -n gamerank-ns -o jsonpath='{.spec.rules[0].host}')"
